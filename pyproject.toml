[tool.black]
line-length = 130
target-version = ["py310"]

[tool.isort]
line_length = 130
py_version = 310
wrap_length = 10
profile = "black"

[tool.autopep8]
max_line_length = 130
in-place = true
recursive = true
aggressive = 3

[tool.ruff]
line-length = 130
target-version = "py310"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
# Django's Meta.fields / widgets etc. are idiomatic mutable class attributes
ignore = ["RUF012"]
